name: Site check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate academic homepage boundary
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          text = Path('index.html').read_text(encoding='utf-8')

          class Parser(HTMLParser):
              pass

          Parser().feed(text)

          required = [
              'id="proof"',
              'id="research"',
              'id="experience"',
              'id="publication"',
              'id="education"',
              'id="engineering"',
              'Altairpaca/dshelm',
              'Altairpaca/AlphaSeeker-TradeMaster',
              '10.1145/3768292.3770349',
              'GitHub engineering profile',
          ]
          missing = [needle for needle in required if needle not in text]
          if missing:
              raise SystemExit(f'missing required academic homepage content: {missing}')

          # PR-level engineering narratives belong to the GitHub profile, not
          # the academic site. This also prevents stale contribution links from
          # silently turning the site back into a duplicate OSS profile.
          forbidden = [
              'id="opensource"',
              'code-yeongyu/oh-my-openagent/pull/',
              'code-yeongyu/senpi/pull/',
              'NousResearch/hermes-agent/pull/',
          ]
          present = [needle for needle in forbidden if needle in text]
          if present:
              raise SystemExit(f'PR-level OSS content leaked into academic surface: {present}')
          PY
