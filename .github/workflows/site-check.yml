name: Site check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate application homepage structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('styles.css').read_text(encoding='utf-8')

          class Parser(HTMLParser):
              pass

          Parser().feed(html)

          required = [
              'id="focus"',
              'id="looking-forward"',
              'id="selected-research"',
              'id="publication"',
              'id="experience"',
              'id="education"',
              'id="engineering"',
              'href="styles.css"',
              '10.1145/3768292.3770349',
              'Reliable learning from non-stationary sequential data',
              'Financial ML & quantitative decision-making',
              'https://www.linkedin.com/in/zhenzhuo-li-2a2bb0307/',
          ]
          missing = [needle for needle in required if needle not in html]
          if missing:
              raise SystemExit(f'missing required application-homepage content: {missing}')

          # Detailed OSS/PR narratives belong to the GitHub profile. The academic
          # homepage may keep one compact engineering-evidence bridge only.
          forbidden = [
              'id="opensource"',
              'code-yeongyu/oh-my-openagent/pull/',
              'code-yeongyu/senpi/pull/',
              'NousResearch/hermes-agent/pull/',
              'GitHub stats',
              'github-readme-stats',
          ]
          present = [needle for needle in forbidden if needle in html]
          if present:
              raise SystemExit(f'OSS-profile content leaked into application surface: {present}')

          if html.count('GitHub engineering profile') > 1:
              raise SystemExit('engineering bridge should remain compact and non-duplicative')

          css_required = ['.hero', '.cv-section', '.focus-row', '.research-item', '.portrait']
          css_missing = [needle for needle in css_required if needle not in css]
          if css_missing:
              raise SystemExit(f'missing core visual-CV styles: {css_missing}')
          PY