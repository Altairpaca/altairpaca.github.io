name: Site check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate professional homepage structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('styles.css').read_text(encoding='utf-8')

          class Parser(HTMLParser):
              pass

          Parser().feed(html)

          required = [
              'id="focus"',
              'id="experience"',
              'id="selected-research"',
              'id="projects"',
              'id="skills"',
              'id="publication"',
              'id="education"',
              'href="styles.css"',
              '10.1145/3768292.3770349',
              'Market microstructure & Level-2 data',
              'Financial ML & robust evaluation',
              'High-performance research systems',
              'https://www.linkedin.com/in/zhenzhuo-li-2a2bb0307/',
              'assets/resume.pdf',
          ]
          missing = [needle for needle in required if needle not in html]
          if missing:
              raise SystemExit(f'missing required homepage content: {missing}')

          forbidden = [
              'id="opensource"',
              'code-yeongyu/oh-my-openagent/pull/',
              'code-yeongyu/senpi/pull/',
              'NousResearch/hermes-agent/pull/',
              'GitHub stats',
              'github-readme-stats',
              '2027 PhD applicant',
              'Agent evidence infrastructure',
          ]
          present = [needle for needle in forbidden if needle in html]
          if present:
              raise SystemExit(f'outdated or OSS-heavy narrative leaked into homepage: {present}')

          css_required = ['.hero', '.cv-section', '.focus-row', '.research-item', '.portrait']
          css_missing = [needle for needle in css_required if needle not in css]
          if css_missing:
              raise SystemExit(f'missing core visual-CV styles: {css_missing}')

          if not Path('assets/resume.pdf').exists():
              raise SystemExit('assets/resume.pdf is missing')
          PY
